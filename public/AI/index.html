<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>思考模倣タスク生成AI</title>
</head>
<body>

  <h2>あなたについて教えてください</h2>

  <form id="questionForm">

    <label><input type="checkbox" name="やりたいことがわからない"> やりたいことがわからない</label><br>
    <label><input type="checkbox" name="anxiety" value="no_confidence"> 自信がない</label><br>
    <label><input type="checkbox" name="doubt" value="future_anxiety"> 将来が不安</label><br>

    <label><input type="checkbox" name="doubt" value="start_unknown"> 何から始めればいいかわからない</label><br>
    <label><input type="checkbox" name="anxiety" value="low_motivation"> モチベーションが湧きにくい</label><br>
    <label><input type="checkbox" name="doubt" value="too_much_info"> 情報が多すぎて迷う</label><br>
    <label><input type="checkbox" name="step" value="see_interest"> 興味の方向性が見えるようになりたい</label><br>

    <label><input type="checkbox" name="step" value="gain_confidence"> 自信をつけたい</label><br>
    <label><input type="checkbox" name="anxiety" value="fear_failure"> 失敗が怖い</label><br>
    <label><input type="checkbox" name="anxiety" value="cant_continue"> 続かない</label><br>

    <label><input type="checkbox" name="social" value="compare_others"> 他人と比べてしまう</label><br>
    <label><input type="checkbox" name="step" value="like_consistency"> コツコツ続けることが好きだ</label><br>
    <label><input type="checkbox" name="social" value="curious"> 好奇心がある方だと思う</label><br>

    <label><input type="checkbox" name="social" value="hate_speaking"> 人前で話すのが苦手</label><br>
    <label><input type="checkbox" name="anxiety" value="hard_to_start"> 取り掛かりが苦手</label><br>

    <button type="submit" id="submit">タスクを生成</button>
  </form>

  <h3>提案されたタスク</h3>
  <div id="result"></div>

  <script src="task_gen.js"></script>
</body>
</html>
